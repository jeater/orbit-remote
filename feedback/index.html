<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sofa RC · Feedback</title>
<link rel="icon" href="../icon.png">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b1116; color: #e6edf2; }
  main { max-width: 560px; margin: 0 auto; padding: 48px 24px; }
  header { text-align: center; }
  header img { width: 88px; height: 88px; border-radius: 20px; box-shadow: 0 0 40px #2dd4bf55; }
  h1 { margin: 16px 0 4px; font-size: 32px; }
  .tagline { color: #8a98a5; margin-top: 0; }
  form { margin-top: 32px; display: grid; gap: 18px; }
  label { display: grid; gap: 6px; font-size: 15px; color: #c3cdd5; }
  input, textarea { font: inherit; color: inherit; background: #131c23; border: 1px solid #263540; border-radius: 12px; padding: 12px 14px; }
  input:focus, textarea:focus { outline: none; border-color: #2dd4bf; }
  textarea { min-height: 160px; resize: vertical; }
  .count { justify-self: end; font-size: 13px; color: #8a98a5; }
  .trap { position: absolute; left: -9999px; }
  button { font: inherit; font-weight: 600; color: #0b1116; background: #2dd4bf; border: 0; border-radius: 999px; padding: 14px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .status { min-height: 1.6em; text-align: center; }
  .status.ok { color: #2dd4bf; }
  .status.error { color: #f87171; }
  a { color: #2dd4bf; }
  footer { margin-top: 40px; text-align: center; font-size: 14px; color: #8a98a5; }
</style>
</head>
<body>
<main>
  <header>
    <img src="../icon.png" alt="Sofa RC icon">
    <h1 data-t="title"></h1>
    <p class="tagline" data-t="intro"></p>
  </header>

  <form id="form" novalidate>
    <label><span data-t="email"></span>
      <input id="email" type="email" maxlength="254" autocomplete="email" required>
    </label>
    <label><span data-t="subject"></span>
      <input id="subject" type="text" maxlength="120" required>
    </label>
    <label><span data-t="message"></span>
      <textarea id="message" maxlength="2000" required></textarea>
      <span class="count" id="count">0 / 2000</span>
    </label>
    <!-- Bots fill every field; people never see this one. -->
    <input class="trap" id="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button id="send" type="submit" data-t="send"></button>
    <p class="status" id="status" role="status"></p>
  </form>

  <footer>
    <a href="../" data-t="home"></a> · <a href="../privacy/" data-t="privacy"></a>
  </footer>
</main>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
  import { getFirestore, collection, addDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';

  // Public web config; access is enforced by firestore.rules (create-only).
  const app = initializeApp({
    apiKey: 'AIzaSyDm8MnqX-oxuENeANvfaEIqCyjWKbu2hSE',
    authDomain: 'orbit-remote-jeater.firebaseapp.com',
    projectId: 'orbit-remote-jeater',
    appId: '1:552767215636:web:32419b31a20d5da69baf01',
  });
  const db = getFirestore(app);

  const strings = {
    en: { title: 'Send feedback', intro: 'Ideas, problems or a TV that does not work? Tell us.', email: 'Your email', subject: 'Subject', message: 'Comment', send: 'Send', sending: 'Sending…', sent: 'Thanks! We got your message.', invalid: 'Please enter a valid email, a subject and a comment.', failed: 'Could not send. Please try again.', home: 'Home', privacy: 'Privacy Policy' },
    es: { title: 'Enviar comentarios', intro: '¿Ideas, problemas o un televisor que no funciona? Cuéntanos.', email: 'Tu correo', subject: 'Asunto', message: 'Comentario', send: 'Enviar', sending: 'Enviando…', sent: '¡Gracias! Recibimos tu mensaje.', invalid: 'Escribe un correo válido, un asunto y un comentario.', failed: 'No se pudo enviar. Inténtalo de nuevo.', home: 'Inicio', privacy: 'Política de privacidad' },
    pt: { title: 'Enviar comentários', intro: 'Ideias, problemas ou uma TV que não funciona? Conte para nós.', email: 'Seu e-mail', subject: 'Assunto', message: 'Comentário', send: 'Enviar', sending: 'Enviando…', sent: 'Obrigado! Recebemos sua mensagem.', invalid: 'Informe um e-mail válido, um assunto e um comentário.', failed: 'Não foi possível enviar. Tente novamente.', home: 'Início', privacy: 'Política de privacidade' },
    fr: { title: 'Envoyer un avis', intro: 'Une idée, un problème ou un téléviseur qui ne fonctionne pas ? Dites-le-nous.', email: 'Votre e-mail', subject: 'Objet', message: 'Commentaire', send: 'Envoyer', sending: 'Envoi…', sent: 'Merci ! Nous avons bien reçu votre message.', invalid: 'Saisissez un e-mail valide, un objet et un commentaire.', failed: "Échec de l'envoi. Veuillez réessayer.", home: 'Accueil', privacy: 'Confidentialité' },
    de: { title: 'Feedback senden', intro: 'Ideen, Probleme oder ein Fernseher, der nicht funktioniert? Schreib uns.', email: 'Deine E-Mail', subject: 'Betreff', message: 'Kommentar', send: 'Senden', sending: 'Wird gesendet…', sent: 'Danke! Deine Nachricht ist angekommen.', invalid: 'Bitte gib eine gültige E-Mail, einen Betreff und einen Kommentar ein.', failed: 'Senden fehlgeschlagen. Bitte versuche es erneut.', home: 'Startseite', privacy: 'Datenschutz' },
  };
  // ?lang=xx (from the app) wins over the browser language.
  const wanted = new URLSearchParams(location.search).get('lang') || navigator.language || 'en';
  const lang = wanted.slice(0, 2).toLowerCase() in strings ? wanted.slice(0, 2).toLowerCase() : 'en';
  const t = strings[lang];
  document.documentElement.lang = lang;
  document.title = `Sofa RC · ${t.title}`;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });

  const $ = (id) => document.getElementById(id);
  const status = (text, kind = '') => { $('status').textContent = text; $('status').className = `status ${kind}`; };
  $('message').addEventListener('input', () => { $('count').textContent = `${$('message').value.length} / 2000`; });

  $('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim();
    const subject = $('subject').value.trim();
    const message = $('message').value.trim();
    if ($('website').value) { status(t.sent, 'ok'); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || !subject || !message) { status(t.invalid, 'error'); return; }

    $('send').disabled = true;
    status(t.sending);
    try {
      await addDoc(collection(db, 'feedback'), { email, subject, message, lang, createdAt: serverTimestamp() });
      $('form').reset();
      $('count').textContent = '0 / 2000';
      status(t.sent, 'ok');
    } catch (err) {
      console.error(err);
      status(t.failed, 'error');
    } finally {
      $('send').disabled = false;
    }
  });
</script>
</body>
</html>
